name: Build Windows EXE & macOS DMG Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller
      - name: Build Windows Setup EXE
        run: python build_release.py
      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageBar-Windows
          path: dist/AIUsageBar-Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python3 -m pip install --upgrade pip pillow pyinstaller
      - name: Build macOS APP & DMG
        run: python3 macos/build_macos.py
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIUsageBar-macOS
          path: dist/AIUsageBar-macOS.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/AIUsageBar-Setup.exe
            release-assets/AIUsageBar-macOS.dmg
